name: release

# A tag is the whole interface: push one, and the archives, checksums and
# release notes come out of .goreleaser.yaml. Nothing here is duplicated from
# that file, so there is only one place to change the release policy.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GoReleaser creates the release

jobs:
  goreleaser:
    runs-on: windows-latest
    steps:
      # Same node24 bump as test.yml. The goreleaser action below was on
      # "using: node20" too, but this workflow only runs on a tag — so its
      # warning would have surfaced on the very first release, not before.
      - uses: actions/checkout@v5
        with:
          # GoReleaser reads the changelog from the commit history, so it needs
          # the whole thing rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Fails the job before anything is built, and prints the failure where
      # you can read it.
      - name: tests
        run: go test ./...

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
